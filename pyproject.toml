[project]
name = "qcbench"
version = "0.0.1"
description = "Execution-graded benchmark for quantum-circuit agents (Qiskit / Cirq)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Yuedong Sun" }]
dependencies = [
    "cirq==1.7.0",
    "numpy==2.4.6",
    "qiskit==2.6.2",
    "qiskit-aer==0.18.2",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "nbstripout==0.9.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["qcbench", "tools"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["qcbench"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["qiskit", "qiskit_aer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
strict_markers = true
addopts = "--strict-markers --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that run the full simulator path or otherwise take longer",
]
