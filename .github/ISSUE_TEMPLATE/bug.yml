name: Bug
description: Report a defect in the harness, verifier, or tooling
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Spec or ADR reference
      description: Quote the line the behaviour should follow.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
    validations:
      required: true
